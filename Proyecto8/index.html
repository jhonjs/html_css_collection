<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main></main>
    <script>
        const container = document.querySelector('main')
        const starsHTML = Array.from({ length: 32 }).map((_, i) => {
            const _color = i % 2 === 0 ? 'white' : 'yellow'
            let sequence = ''
            if (i % 2 === 0) sequence = 'r2'
            if(i % 4 === 0) sequence = 'r3'
            return `<div class="point ${_color} ${sequence}"></div>`
        }).join('')
        
        container.innerHTML = starsHTML

    </script>
</body>
</html>

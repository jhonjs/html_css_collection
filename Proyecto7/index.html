<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <button class="btn home">
            <span>HOME</span>
            <i class="material-symbols-outlined">home</i></button>
        <button class="btn messages">
            <span>MESSAGES</span>
            <i class="fa-regular fa-comment"></i></button>
        <button class="btn favorites">
            <span>FAVORITES</span>
            <i class="material-symbols-outlined">favorite</i></button>
        <button class="btn video">
            <span>VIDEO</span>
            <i class="material-symbols-outlined">videocam</i></button>
        <button class="btn photos">
            <span>PHOTOS</span>
            <i class="material-symbols-outlined">photo_camera</i></button>
    </main>
</body>
</html>

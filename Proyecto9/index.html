<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Sport</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <article class="card">
            <div class="card__img">
                <img src="img/shoes.png" alt="shoes">
            </div>
            <div class="card__content">
                <h3>Nike Shoes</h3>
                <div class="card__content-size">
                    <div>size</div>
                    <div>7</div>
                    <div>8</div>
                    <div>9</div>
                    <div>10</div>
                </div>
                <div class="card__content-color">
                    <div>color</div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <button>Buy now</button>
            </div>
        </article>
    </main>
</body>
</html>

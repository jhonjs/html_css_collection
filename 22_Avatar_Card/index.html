<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
  </style>
</head>
<body>
  <main>
    <article class="card">
      <div class="imgBx">
        <img src="img/portada.jpg" alt="">
      </div>
      <div class="details">
        <div class="imgContent">
          <img src="img/logoavatar.png" alt="">
          <p>Directed by James Cameron</p>
        </div>
        <div class="rating">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-regular fa-star"></i>
          <span>4/5</span>
        </div>
        <div class="tags">
          <div>Fantasy</div>
          <div>Mystery</div>
        </div>
        <div class="info">
          <p>
            “Ambientada más de una década después de los eventos de la primera
            película, Avatar: The Way of Water comienza a contar la historia de
            la familia Sully (Jake, Neytiri y sus hijos), los problemas que
            los...”.
          </p>
        </div>

        <div class="cast">
          <h4>Elenco</h4>
          <ul>
            <li>
              <img
                src="http://www.gstatic.com/tv/thumb/persons/73414/73414_v9_bb.jpg"
              />
            </li>
            <li>
              <img
                src="http://www.gstatic.com/tv/thumb/persons/25704/25704_v9_bb.jpg"
              />
            </li>
            <li>
              <img
                src="http://www.gstatic.com/tv/thumb/persons/554/554_v9_bb.jpg"
              />
            </li>
            <li>
              <img
                src="http://www.gstatic.com/tv/thumb/persons/8439/8439_v9_ba.jpg"
              />
            </li>
          </ul>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
